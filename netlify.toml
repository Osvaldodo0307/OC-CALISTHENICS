# Netlify + Git (monorepo): raiz del repo = carpeta que contiene /OC
# Sitio de produccion: https://oc-club.netlify.app
# Tras enlazar GitHub, Netlify lee este archivo automaticamente (no hace falta Netlify Drop).

[build]
  base = "OC/Frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
