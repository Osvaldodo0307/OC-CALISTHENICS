name: OC-CLUB Frontend Build

on:
  pull_request:
    branches: [main]
    paths:
      - "OC/Frontend/**"
      - ".github/workflows/oc-club-frontend-build.yml"
  push:
    branches: [main]
    paths:
      - "OC/Frontend/**"
      - ".github/workflows/oc-club-frontend-build.yml"

permissions:
  contents: read

jobs:
  frontend-build:
    name: Check TypeScript and Vite production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OC/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: OC/Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
