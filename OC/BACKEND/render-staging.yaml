# Render staging — backend desde rama feature/historical-visits-2c1
# Crear servicio manual en Render; NO reemplazar oc-calisthenics-api (produccion).

services:
  - type: web
    name: oc-calisthenics-api-staging
    runtime: python
    region: oregon
    plan: free
    branch: feature/historical-visits-2c1
    rootDir: OC/BACKEND
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "1440"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.7"
