# Conectar GitHub en Render: Root Directory = OC/BACKEND
# En el panel, define ALLOWED_ORIGINS (ej. https://oc-club.netlify.app) para CORS con Netlify.

services:
  - type: web
    name: oc-calisthenics-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "1440"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.7"
