# Si Netlify esta enlazado al repo desde la RAIZ, usa netlify.toml en la raiz del monorepo (base OC/Frontend).
# Si en el panel pones "Base directory" = OC/Frontend, Netlify usa este archivo tal cual.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/app/*"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/tienda/*"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/tienda"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/app"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/tienda/carrito"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/tienda/checkout"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[build.environment]
  NODE_VERSION = "18"
