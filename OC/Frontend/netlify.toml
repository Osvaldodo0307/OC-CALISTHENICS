# Si Netlify esta enlazado al repo desde la RAIZ, usa netlify.toml en la raiz del monorepo (base OC/Frontend).
# Si en el panel pones "Base directory" = OC/Frontend, Netlify usa este archivo tal cual.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
